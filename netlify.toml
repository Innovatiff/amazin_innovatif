# The payment service for checkouts (Helcim). See "Card payments" in README.md.
#
# The website itself is on Firebase Hosting. Netlify only runs the three small
# functions in payments/functions, which keep the Helcim API token away from the
# browser. Set HELCIM_API_TOKEN under Site configuration → Environment variables.

[build]
  base = "payments"
  publish = "public"
  command = "echo 'Nothing to build: the functions are bundled by Netlify.'"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Content-Type-Options = "nosniff"
